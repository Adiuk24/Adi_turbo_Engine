<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdiTurbo UI</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --muted: #8b949e;
      --text: #e6edf3;
      --accent: #2f81f7;
      --user: #1f6feb;
      --assistant: #30363d;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      height: 100vh;
      display: grid;
      grid-template-columns: 260px 1fr;
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .brand {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: .2px;
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
    }
    label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }
    input, select, button, textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #0f141b;
      color: var(--text);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
    }
    button {
      background: var(--accent);
      border: 0;
      cursor: pointer;
      font-weight: 600;
    }
    .danger {
      background: #3d1f25;
      border: 1px solid #6e2d37;
      color: #fdaeb7;
    }
    .main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }
    .top {
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
    }
    .status {
      color: var(--muted);
      font-size: 12px;
    }
    .chat {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: min(820px, 90%);
      border-radius: 12px;
      padding: 10px 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      font-size: 14px;
      border: 1px solid var(--border);
    }
    .msg.user {
      margin-left: auto;
      background: var(--user);
      border-color: transparent;
      color: #fff;
    }
    .msg.assistant {
      background: var(--assistant);
    }
    .composer {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }
    textarea {
      resize: vertical;
      min-height: 56px;
      max-height: 200px;
      font-family: inherit;
    }
    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="brand">AdiTurbo</div>
      <div class="sub">Weights + KV + Runtime</div>
    </div>

    <div>
      <label for="apiBase">API Base</label>
      <input id="apiBase" />
    </div>

    <div>
      <label for="modelSelect">Model</label>
      <select id="modelSelect"></select>
    </div>

    <div>
      <label for="temperature">Temperature</label>
      <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7" />
    </div>

    <button id="refreshBtn">Refresh Models</button>
    <button id="clearBtn" class="danger">Clear Chat</button>
    <div class="hint">UI style: Ollama-like local chat. API compatible with llama-server.</div>
  </aside>

  <main class="main">
    <div class="top">
      <strong id="title">AdiTurbo Chat</strong>
      <div class="status" id="status">Ready</div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="composer">
      <div>
        <textarea id="prompt" placeholder="Ask anything..."></textarea>
        <div class="hint">Enter = send, Shift+Enter = newline</div>
      </div>
      <button id="sendBtn">Send</button>
    </div>
  </main>

  <script>
    const chatEl = document.getElementById("chat");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");
    const apiBaseEl = document.getElementById("apiBase");
    const modelSelectEl = document.getElementById("modelSelect");
    const refreshBtn = document.getElementById("refreshBtn");
    const clearBtn = document.getElementById("clearBtn");
    const tempEl = document.getElementById("temperature");
    const titleEl = document.getElementById("title");

    const qs = new URLSearchParams(window.location.search);
    const presetApi = qs.get("api") || "http://127.0.0.1:11434";
    const presetModel = qs.get("model") || "";
    apiBaseEl.value = presetApi;
    let messages = [];

    function setStatus(msg) { statusEl.textContent = msg; }

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.textContent = text;
      chatEl.appendChild(el);
      chatEl.scrollTop = chatEl.scrollHeight;
      return el;
    }

    async function loadModels() {
      const base = apiBaseEl.value.replace(/\/+$/, "");
      setStatus("Loading models...");
      try {
        const r = await fetch(`${base}/v1/models`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const payload = await r.json();
        const models = (payload.data || []).map(m => m.id).sort();
        modelSelectEl.innerHTML = "";
        for (const id of models) {
          const o = document.createElement("option");
          o.value = id;
          o.textContent = id;
          modelSelectEl.appendChild(o);
        }
        if (presetModel && models.includes(presetModel)) {
          modelSelectEl.value = presetModel;
        }
        if (!modelSelectEl.value && models.length) {
          modelSelectEl.value = models[0];
        }
        titleEl.textContent = `AdiTurbo Chat — ${modelSelectEl.value || "No model"}`;
        setStatus(models.length ? "Ready" : "No models");
      } catch (err) {
        setStatus(`Model load failed: ${err.message}`);
      }
    }

    async function sendMessage() {
      const text = promptEl.value.trim();
      const model = modelSelectEl.value;
      const base = apiBaseEl.value.replace(/\/+$/, "");
      if (!text) return;
      if (!model) {
        setStatus("Select a model first");
        return;
      }
      promptEl.value = "";
      addMessage("user", text);
      const assistantEl = addMessage("assistant", "...");
      setStatus("Generating...");

      const outgoing = [...messages, { role: "user", content: text }];
      try {
        const r = await fetch(`${base}/v1/chat/completions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model,
            messages: outgoing,
            stream: false,
            temperature: Number(tempEl.value || 0.7)
          })
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const payload = await r.json();
        const content = payload?.choices?.[0]?.message?.content || "";
        assistantEl.textContent = content || "[empty response]";
        messages = [...outgoing, { role: "assistant", content }];
        setStatus("Ready");
      } catch (err) {
        assistantEl.textContent = `Error: ${err.message}`;
        setStatus("Error");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    refreshBtn.addEventListener("click", loadModels);
    clearBtn.addEventListener("click", () => {
      messages = [];
      chatEl.innerHTML = "";
      setStatus("Cleared");
    });
    modelSelectEl.addEventListener("change", () => {
      titleEl.textContent = `AdiTurbo Chat — ${modelSelectEl.value || "No model"}`;
    });

    loadModels();
  </script>
</body>
</html>
